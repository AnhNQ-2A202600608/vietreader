# Blueprint cho Render. Xem DEPLOY_RENDER.md.
#
# Render đọc file này ở GỐC repo, nhưng app nằm trong thư mục con nên có rootDir.
# Sau khi sửa file này, vào Render bấm "Sync" để áp dụng.
services:
  - name: vietreader
    type: web
    runtime: docker
    plan: free
    region: singapore

    # App nằm ở thư mục con vietreader/ của repo, không phải ở gốc.
    rootDir: vietreader
    dockerfilePath: ./Dockerfile
    dockerContext: ./

    # Readiness includes SELECT 1, so a deploy with a broken Neon URL/schema never receives traffic.
    healthCheckPath: /api/ready
    maxShutdownDelaySeconds: 60

    # Render chỉ deploy commit sau khi các check của commit đó xanh.
    autoDeployTrigger: checksPass

    envVars:
      # sync: false = Render KHÔNG lấy giá trị từ file này mà bắt bạn nhập trên dashboard.
      # Đây là bí mật. REQUIRE_POSTGRES bên dưới khiến service dừng ngay nếu thiếu hoặc nhầm URL,
      # thay vì rơi về SQLite trên filesystem tạm của Render.
      - key: VIETREADER_DATABASE_URL
        sync: false
      - key: VIETREADER_REQUIRE_POSTGRES
        value: "1"
      - key: VIETREADER_AUTO_CREATE_SCHEMA
        value: "0"

      # Để trống nếu không muốn mở tính năng ASK ra Internet — xem DEPLOY_RENDER.md §6.
      - key: VIETREADER_LLM_API_KEY
        sync: false

      - key: VIETREADER_READER_NAME
        value: Ngân Giang

      # Render có URL công khai nên không được khởi động nếu thiếu credentials.
      - key: VIETREADER_REQUIRE_AUTH
        value: "1"
      - key: VIETREADER_AUTH_USERNAME
        value: vietreader
      - key: VIETREADER_AUTH_PASSWORD
        sync: false

      # seed_dictionary.py bỏ qua entry đã có nên chạy lại an toàn.
      - key: VIETREADER_SEED_ON_START
        value: "1"
