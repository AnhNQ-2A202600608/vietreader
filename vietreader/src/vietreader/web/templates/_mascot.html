{#
  Mây — linh vật của VietReader. Một tinh linh mây nhỏ, vẽ tay hoàn toàn bằng SVG.
  Dùng: {% with mood = "happy" | "sleepy" | "reading", size = "sm" | "md" | "lg" %}
        {% include "_mascot.html" %}{% endwith %}
  Màu lấy từ biến CSS nên tự đổi theo sáng/tối.
#}
<svg class="mascot mascot-{{ size|default('md') }} mascot-{{ mood|default('happy') }}"
     viewBox="0 0 132 104" role="img"
     aria-label="Mây, linh vật của VietReader">
  <title>Mây</title>

  <g class="mascot-sparkles" aria-hidden="true">
    <path class="sparkle sparkle-1" d="M18 22 l2.4 5.6 5.6 2.4 -5.6 2.4 -2.4 5.6 -2.4 -5.6 -5.6 -2.4 5.6 -2.4z"/>
    <path class="sparkle sparkle-2" d="M114 16 l1.8 4.2 4.2 1.8 -4.2 1.8 -1.8 4.2 -1.8 -4.2 -4.2 -1.8 4.2 -1.8z"/>
    <path class="sparkle sparkle-3" d="M119 62 l1.4 3.2 3.2 1.4 -3.2 1.4 -1.4 3.2 -1.4 -3.2 -3.2 -1.4 3.2 -1.4z"/>
  </g>

  <g class="mascot-body">
    {# Thân mây: các cụm tròn ghép lại #}
    <path class="cloud" d="M38 82
      a20 20 0 0 1 -3 -39.6
      a17 17 0 0 1 16.6 -20.4
      a21 21 0 0 1 37.4 6
      a19 19 0 0 1 5 37.4
      z"/>

    {# Má hồng #}
    <ellipse class="blush" cx="41" cy="62" rx="7" ry="4.6"/>
    <ellipse class="blush" cx="89" cy="62" rx="7" ry="4.6"/>

    {# Mắt #}
    <g class="eyes">
      <ellipse class="eye" cx="53" cy="53" rx="3.6" ry="4.4"/>
      <ellipse class="eye" cx="77" cy="53" rx="3.6" ry="4.4"/>
      <circle class="eye-shine" cx="54.4" cy="51.4" r="1.3"/>
      <circle class="eye-shine" cx="78.4" cy="51.4" r="1.3"/>
    </g>
    {# Mắt lim dim, chỉ hiện ở mood="sleepy" #}
    <g class="eyes-closed">
      <path d="M48.5 53 q4.5 4.4 9 0" />
      <path d="M72.5 53 q4.5 4.4 9 0" />
    </g>

    {# Miệng #}
    <path class="mouth" d="M60 63 q5 5.4 10 0"/>

    {# Cuốn sách nhỏ, chỉ hiện ở mood="reading" #}
    <g class="mascot-book">
      <path class="book-page" d="M50 74 h14 a3 3 0 0 1 3 3 v11 h-17z"/>
      <path class="book-page" d="M82 74 h-14 a3 3 0 0 0 -3 3 v11 h17z"/>
      <path class="book-spine" d="M65.2 77 h1.6 v11 h-1.6z"/>
    </g>
  </g>
</svg>
