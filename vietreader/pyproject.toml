[project]
name = "vietreader"
version = "0.1.0"
description = "AI Vietnamese Reading Assistant"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<1.14",
    "pydantic>=2.9,<2.10",
    "pydantic-settings>=2.5,<2.6",
    "httpx>=0.27,<0.28",
    "pyahocorasick>=2.1,<2.2",
    "selectolax>=0.3,<0.4",
    "trafilatura>=1.12,<1.13",
    "lxml_html_clean>=0.4,<0.5",
    "jinja2>=3.1,<3.2",
    "python-multipart>=0.0.12,<0.1",
    "pyyaml>=6.0,<6.1",
    "orjson>=3.10,<3.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<8.4",
    "pytest-cov>=5.0,<6.0",
    "pytest-asyncio>=0.24,<0.25",
    "hypothesis>=6.112,<6.113",
    "ruff>=0.6,<0.7",
    "mypy>=1.11,<1.12",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: requires real network/LLM credentials, skipped by default",
]
addopts = "-ra -m \"not live\""
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's `Depends(...)` in argument defaults is the documented, idiomatic pattern, not the
# mutable-default-argument bug B008 is meant to catch.
"src/vietreader/api/**" = ["B008"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = "vietreader.core.*"
strict = true

[[tool.mypy.overrides]]
module = "ahocorasick"
ignore_missing_imports = true
