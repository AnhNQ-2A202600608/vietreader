name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
        working-directory: vietreader
      - name: Lint
        run: python -m ruff check src tests
        working-directory: vietreader
      - name: Typecheck
        run: python -m mypy src/vietreader/core
        working-directory: vietreader
      - name: Test
        run: python -m pytest -q --cov=vietreader --cov-report=term-missing
        working-directory: vietreader
